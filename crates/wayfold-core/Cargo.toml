[package]
name = "wayfold-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Redirects Move to Trash into `<data_dir>/test-trash`, but only while WAYFOLD_DATA_DIR is set. Enabled by the
# `wayfold` dev-dependency; feature unification can still link it into the app binary (e.g. `--all-targets`).
test-trash = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
libc.workspace = true
tracing.workspace = true
plist = "1.10"
ammonia = "4.1"
csv = "1.4"
imagesize = "0.14"
regex = "1.13"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSObject", "NSEnumerator"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace"] }
portable-pty = "0.9"
alacritty_terminal = { version = "0.26", default-features = false }
blake3 = "1.8"
zip = "9.8"
tar = "0.4.46"
flate2 = "1.1"
zstd = "0.13"
sevenz-rust2 = "0.25"
unrar = "0.5.8"

[dev-dependencies]
tempfile.workspace = true
